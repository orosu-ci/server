name: Build and publish deb package
on:
  release:
    types: [published]

env:
  PACKAGE_NAME: 'orosu-server'

jobs:
  verify:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Tag version: ${TAG_VERSION}"
          echo "Cargo.toml version: ${CARGO_VERSION}"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "Error: Tag version (${TAG_VERSION}) does not match Cargo.toml version (${CARGO_VERSION})"
            exit 1
          fi
          echo "Version check passed: ${TAG_VERSION}"

  build-deb:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            cross: false
          - arch: arm64
            target: aarch64-unknown-linux-musl
            cross: true

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git build-essential pkg-config libssl-dev ca-certificates musl-tools

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ matrix.distro }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.distro }}-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked || true

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Build DEB server package
        id: build_deb_server
        run: |
          DEB_PATH=$(cargo deb --no-build --target ${{ matrix.target }} -p orosu-server)
          echo "deb_path=${DEB_PATH}" >> $GITHUB_OUTPUT
          echo "Built package: ${DEB_PATH}"

      - name: Upload keygen binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: orosu-keygen-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/orosu-keygen
          retention-days: 90

      - name: Upload DEB server artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-server-${{ matrix.arch }}
          path: ${{ steps.build_deb_server.outputs.deb_path }}
          retention-days: 90

      - name: Rename binaries for release
        run: |
          mv target/${{ matrix.target }}/release/orosu-keygen target/${{ matrix.target }}/release/orosu-keygen-${{ matrix.arch }}

      - name: Attach outputs to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/${{ matrix.target }}/release/orosu-keygen-${{ matrix.arch }}
            ${{ steps.build_deb_server.outputs.deb_path }}

  deploy-packages:
    needs: build-deb
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Download DEB server artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-server-${{ matrix.arch }}
          path: ./packages

      - name: Upload and publish DEB packages
        uses: orosu-ci/orosu@v0
        with:
          address: ${{ secrets.OROSU_HOST }}
          key: ${{ secrets.OROSU_SECRET }}
          script: deploy-deb-to-repo
          chunk_size: 131072
          # orosu-ci/orosu@v0 currently still resolves to the old, pre-JS-
          # rewrite composite action (v0 == v0.4.0, confirmed via
          # `git merge-base --is-ancestor js-action v0` returning false in
          # the client/ repo) — that action's input is named `arguments`,
          # not `args`. The new JS action (client/, `js-action` branch) does
          # use `args`, but it hasn't been published and `v0` hasn't been
          # moved to it yet. Switch this back to `args` once that happens —
          # using the wrong name here fails silently (unrecognized input,
          # script gets zero arguments) rather than erroring.
          arguments: stable
          file: |-
            packages/*.deb

  self-restart:
    # deploy-packages runs as an amd64/arm64 matrix, publishing to the same
    # repo twice — this job needs the whole matrix (both legs), not a step
    # inside it, so the restart only fires once after both have finished.
    needs: deploy-packages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Restart orosu-server to pick up the newly deployed version
        uses: orosu-ci/orosu@v0
        with:
          address: ${{ secrets.OROSU_HOST }}
          key: ${{ secrets.OROSU_SECRET }}
          script: self-restart